name: Android builds

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - module: probe
            apk: vvm-research-probe.apk
          - module: app
            apk: visual-voice-mail.apk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify and prepare pinned tools
        run: python3 probe/bootstrap.py
      - name: Build and verify APK
        run: python3 probe/build.py --module ${{ matrix.module }}
      - name: Check original Python sources
        run: python3 -m compileall -q research/*.py probe/*.py
      - name: Check native theme text contrast
        if: matrix.module == 'app'
        run: python3 research/check_ui_contrast.py
      - name: Check inbox, storage, and notification behavior
        if: matrix.module == 'app'
        run: python3 research/check_inbox_query.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: visual-voice-mail-${{ matrix.module }}
          path: ${{ matrix.module }}/build/${{ matrix.apk }}
          retention-days: 7
          if-no-files-found: error
